<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- font -->
     <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">
    <!-- Tailwind -->
     <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        .manrope-font{
                font-family: "Manrope", sans-serif;
                font-optical-sizing: auto;
                font-style: normal;
}
    </style>
    <title>Tea House</title>
</head>
<body class="manrope-font">
        <header class="flex justify-between max-w-[1296px] mt-[68px] mx-auto">
            <div class="text-content">
                <h1 class="font-bold text-[80px]/[100px] mb-[30px] ">It's good<br> tea time at The<br> Tea House</h1>
                <p class="text-[18px]/[30px] text-[#777777] mb-[30px]">Tea and Botanical Solutions Supplier Give Optimum <br> Satisfaction To Your Taste Buds.</p>
                <button class="border px-5 py-[18px] rounded-[10px] text-5 font-bold bg-red-500 text-white cursor-pointer bg-linear-to-r from-[#FF8938] to-[#FF0000]">Explore More <img class="inline ml-3" src="images/arrow.png" alt=""></button>
            </div>
            <div class="image-content relative top-[30px]">
                <img src="images/banner.png" alt="">
                <div class="ratings flex gap-3 border-none rounded-2xl shadow-[0_7px_70px_0px_#0000000f]  max-w-[260px] items-center px-[27px] py-[19px] bg-white absolute bottom-[30px] left-20">
                    <img class="w-[47px] h-[45px]" src="images/Group 5.png" alt="">
                    <div class="text-contents">
                        <h1 class="text-[30px] font-bold">5.00</h1>
                    <p class="font-semibold text-[#777777]">Trust Pilot Ratings</p>
                    </div>
                    
                </div>
            </div>
        </header>
</body>
</html>
